# MentionMate — Telegram mention alert daemon
# Docs: https://github.com/PhamHoang16/mention-mate
#
# You only need this file + .env (from .env.example) + a ./data directory,
# then run: docker compose up -d
#
# The wizard (./mention-mate.sh or mention-mate.ps1) configures all of the above for you.

services:
  bot:
    image: ghcr.io/phamhoang16/mention-mate:latest
    container_name: mention-mate
    restart: unless-stopped

    # Configuration loaded from .env (same directory as this compose file).
    # NEVER commit .env to git.
    env_file: .env

    # Mount the ./data directory so the Telethon session persists across restart/update.
    # DO NOT delete this directory unless you want to re-authenticate.
    volumes:
      - ./data:/app/data

    # Healthcheck: PID 1 alive == container alive. No extra binary required
    # (the image no longer ships procps/pgrep for size/security reasons).
    # The hardening phase will upgrade this to an HTTP /healthz endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/proc/1/status') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging: 10 MB per file, 3 files retained = max 30 MB on disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
