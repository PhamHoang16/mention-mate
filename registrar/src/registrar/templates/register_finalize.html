<!doctype html>
<html>
<head><meta charset="utf-8"><title>MentionMate — Finalize</title></head>
<body>
  <h1>Almost done</h1>
  <p>Open Telegram, find the shared alert bot, and send: <code>/start {{ nonce }}</code> — then click Confirm.</p>
  <button id="confirm-btn">Confirm</button>
  <p id="status"></p>
  <script>
    document.getElementById("confirm-btn").addEventListener("click", async () => {
      const resp = await fetch("/register/finalize", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username: {{ username | tojson }}}),
      });
      const text = await resp.text();
      if (resp.status === 202) {
        document.getElementById("status").textContent =
          "Registration queued — you'll get a confirmation message on Telegram once it's ready.";
      } else if (resp.ok) {
        document.getElementById("status").textContent = "Your MentionMate is now running!";
      } else {
        document.getElementById("status").textContent = "Not ready yet: " + text;
      }
    });
  </script>
</body>
</html>
