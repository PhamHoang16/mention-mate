{% extends "base.html" %}
{% block title %}MentionMate — Finalize{% endblock %}
{% block content %}
  <h1>Almost done</h1>
  <p class="hint">Open Telegram, find the shared alert bot, and send this exact message:</p>
  <code class="code-block">/start {{ nonce }}</code>
  <p class="hint">Then click Confirm below.</p>
  <button id="confirm-btn">Confirm</button>
  <p id="status"></p>
{% endblock %}
{% block script %}
<script>
  document.getElementById("confirm-btn").addEventListener("click", async (e) => {
    const status = document.getElementById("status");
    e.target.disabled = true;
    status.className = "";
    status.textContent = "Checking…";
    const resp = await fetch("/register/finalize", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: {{ username | tojson }}}),
    });
    if (resp.status === 202) {
      status.className = "success";
      status.textContent = "Registration queued — you'll get a confirmation message on Telegram once it's ready.";
    } else if (resp.ok) {
      status.className = "success";
      status.textContent = "Your MentionMate is now running!";
    } else {
      status.className = "error";
      status.textContent = "Not ready yet: " + (await describeError(resp));
      e.target.disabled = false;
    }
  });
</script>
{% endblock %}
