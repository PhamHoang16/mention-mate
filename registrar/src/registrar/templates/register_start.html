{% extends "base.html" %}
{% block title %}MentionMate — Register{% endblock %}
{% block content %}
  <h1>Register for MentionMate</h1>
  <p class="hint">
    Create your own API_ID/API_HASH first at
    <a href="https://my.telegram.org/apps" target="_blank" rel="noopener">my.telegram.org/apps</a>,
    then fill this in.
  </p>
  <form id="start-form">
    <div class="field">
      <label for="phone">Phone number<span class="sub">With country code, e.g. +84912345678</span></label>
      <input id="phone" name="phone" required>
    </div>
    <div class="field">
      <label for="api_id">API_ID</label>
      <input id="api_id" name="api_id" type="number" required>
    </div>
    <div class="field">
      <label for="api_hash">API_HASH</label>
      <input id="api_hash" name="api_hash" required>
    </div>
    <div class="field">
      <label for="username">Telegram username<span class="sub">Without the leading @</span></label>
      <input id="username" name="username" required>
    </div>
    <button type="submit">Send code</button>
  </form>
  <p id="status"></p>
{% endblock %}
{% block script %}
<script>
  document.getElementById("start-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = document.getElementById("status");
    status.className = "";
    status.textContent = "Sending code…";
    const form = new FormData(e.target);
    const body = {
      phone: form.get("phone"),
      api_id: parseInt(form.get("api_id"), 10),
      api_hash: form.get("api_hash"),
      username: form.get("username"),
    };
    const resp = await fetch("/register/start", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    if (resp.ok) {
      window.location = `/register/verify-page?username=${encodeURIComponent(body.username)}`;
    } else {
      status.className = "error";
      status.textContent = "Could not send code: " + (await resp.text());
    }
  });
</script>
{% endblock %}
