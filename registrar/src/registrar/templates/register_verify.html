{% extends "base.html" %}
{% block title %}MentionMate — Verify{% endblock %}
{% block content %}
  <h1>Enter the code</h1>
  <p class="hint">Telegram just sent a login code to your account — enter it below.</p>
  <form id="verify-form">
    <input type="hidden" name="username" value="{{ username }}">
    <div class="field">
      <label for="code">Code</label>
      <input id="code" name="code" required autocomplete="one-time-code">
    </div>
    <div class="field">
      <label for="password">2FA password<span class="sub">Only if your account has cloud password enabled</span></label>
      <input id="password" name="password" type="password">
    </div>
    <button type="submit">Confirm</button>
  </form>
  <p id="status"></p>
{% endblock %}
{% block script %}
<script>
  document.getElementById("verify-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = document.getElementById("status");
    status.className = "";
    status.textContent = "Verifying…";
    const form = new FormData(e.target);
    const body = {
      username: form.get("username"),
      code: form.get("code"),
      password: form.get("password") || null,
    };
    const resp = await fetch("/register/verify", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });
    if (resp.ok) {
      window.location = `/register/finalize-page?username=${encodeURIComponent(body.username)}`;
    } else {
      status.className = "error";
      status.textContent = "Could not verify: " + (await describeError(resp));
    }
  });
</script>
{% endblock %}
