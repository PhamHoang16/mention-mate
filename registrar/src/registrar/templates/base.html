<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MentionMate{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7fb;
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.9);
      --text: #1c1e2b;
      --muted: #6b6f85;
      --border: rgba(28, 30, 43, 0.10);
      --field-bg: rgba(255, 255, 255, 0.6);
      --accent-1: #6366f1;
      --accent-2: #a855f7;
      --accent-solid: #6366f1;
      --danger: #dc2626;
      --success: #16a34a;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Mesh-gradient background: three soft, slowly-drifting blurred blobs. */
    .mesh { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .mesh span {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      will-change: transform;
    }
    .mesh span:nth-child(1) {
      width: 46vw; height: 46vw; max-width: 620px; max-height: 620px;
      top: -12%; left: -10%;
      background: radial-gradient(circle at 30% 30%, #a5b4fc, transparent 70%);
      animation: drift1 22s ease-in-out infinite;
    }
    .mesh span:nth-child(2) {
      width: 40vw; height: 40vw; max-width: 560px; max-height: 560px;
      bottom: -14%; right: -8%;
      background: radial-gradient(circle at 60% 60%, #f0abfc, transparent 70%);
      animation: drift2 26s ease-in-out infinite;
    }
    .mesh span:nth-child(3) {
      width: 30vw; height: 30vw; max-width: 420px; max-height: 420px;
      top: 40%; left: 60%;
      background: radial-gradient(circle at 50% 50%, #67e8f9, transparent 70%);
      opacity: 0.3;
      animation: drift3 30s ease-in-out infinite;
    }
    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, 6%) scale(1.08); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-5%, -4%) scale(1.05); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-6%, 5%) scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mesh span { animation: none; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 20px 60px rgba(99, 102, 241, 0.12),
        0 8px 24px rgba(28, 30, 43, 0.08);
      padding: 36px 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .brand .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 0 12px 2px rgba(129, 140, 248, 0.7);
      flex-shrink: 0;
    }
    .brand span {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.01em;
      margin: 0 0 8px;
      line-height: 1.3;
      background: linear-gradient(135deg, #1c1e2b 20%, var(--accent-1) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.hint {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    p.hint a { color: var(--accent-1); text-decoration: none; }
    p.hint a:hover { text-decoration: underline; }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .field .sub {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--field-bg);
      color: var(--text);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    input::placeholder { color: #a1a5b8; }
    input:focus {
      outline: none;
      border-color: var(--accent-1);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.14);
    }
    button {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      margin-top: 4px;
      box-shadow: 0 8px 24px -8px rgba(139, 143, 245, 0.6);
    }
    button:hover { filter: brightness(1.08); box-shadow: 0 10px 30px -6px rgba(139, 143, 245, 0.75); }
    button:active { transform: translateY(1px) scale(0.99); }
    button:disabled { opacity: 0.55; cursor: not-allowed; filter: none; box-shadow: none; }
    code {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
      color: #4f46e5;
    }
    .code-block {
      display: block;
      padding: 14px 16px;
      margin: 12px 0 20px;
      font-size: 16px;
      text-align: center;
      word-break: break-all;
      letter-spacing: 0.02em;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
      min-height: 1.2em;
    }
    #status.error { color: var(--danger); }
    #status.success { color: var(--success); }

    details.howto {
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.04);
      overflow: hidden;
    }
    details.howto summary {
      cursor: pointer;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-1);
      list-style: none;
    }
    details.howto summary::-webkit-details-marker { display: none; }
    details.howto summary::before {
      content: "▶";
      display: inline-block;
      margin-right: 6px;
      font-size: 10px;
      transition: transform 0.15s ease;
    }
    details.howto[open] summary::before { transform: rotate(90deg); }
    details.howto .howto-body {
      padding: 0 14px 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    details.howto ol { margin: 0; padding-left: 20px; }
    details.howto li { margin-bottom: 6px; }
    details.howto .field-map {
      margin: 10px 0 0;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    details.howto .field-map div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 0;
    }
    details.howto .field-map span:first-child {
      color: var(--text);
      font-weight: 600;
      flex-shrink: 0;
    }
    details.howto code {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="mesh"><span></span><span></span><span></span></div>
  <div class="card">
    <div class="brand"><span class="dot"></span><span>MentionMate</span></div>
    {% block content %}{% endblock %}
  </div>
  <script>
    // FastAPI error responses are JSON: {"detail": "..."}. Fall back to the
    // raw text if the body isn't JSON (e.g. a proxy-generated error page).
    async function describeError(resp) {
      const text = await resp.text();
      try {
        const data = JSON.parse(text);
        if (data && typeof data.detail === "string") return data.detail;
      } catch (e) { /* not JSON, fall through */ }
      return text;
    }
  </script>
  {% block script %}{% endblock %}
</body>
</html>
